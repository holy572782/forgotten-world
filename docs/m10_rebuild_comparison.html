<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>風渡りの丘｜工程01 構図比較</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; background: #eeeee6; color: #26332d; font: 16px/1.6 system-ui, sans-serif }
    main { max-width: 1800px; margin: auto; padding: clamp(16px, 3vw, 48px) }
    h1 { margin: 0; font-size: clamp(1.5rem, 3vw, 2.1rem) }
    h2 { margin: 1.8em 0 .5em; font-size: 1.27rem }
    p { margin: .4em 0 1em }
    fieldset { min-width: 0; margin: 0; border: 0; padding: 0 }
    legend { font-weight: 600; margin-bottom: .25em }
    label { margin-right: 1em; cursor: pointer }
    .pair, .details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: .85em }
    figure { margin: 0; padding: 10px; background: #fafaf4; border: 1px solid #d5d8c9; border-radius: 6px }
    figcaption { margin: 0 0 6px; font-weight: 600 }
    img { display: block; width: 100%; height: auto }
    a { color: #24554b }
    #before:checked ~ .pair .reference, #reference:checked ~ .pair .before { display: none }
    @media (max-width: 760px) { .pair, .details { grid-template-columns: 1fr } }
  </style>
</head>
<body><main>
  <h1>風渡りの丘　工程01の構図比較</h1>
  <p>固定画面は1672 × 941。修正前後とも同じカメラ・照明で撮影しています。画像を選ぶと原寸で開きます。</p>
  <fieldset>
    <legend>修正後と並べる画像</legend>
    <input type="radio" name="compare" id="before" checked><label for="before">修正前</label>
    <input type="radio" name="compare" id="reference"><label for="reference">参考原画</label>
    <div class="pair">
      <figure class="before"><figcaption>修正前の固定構図</figcaption>
        <a href="images/m10_rebuild/relief/before_comparison.png"><img src="images/m10_rebuild/relief/before_comparison.png" alt="修正前。広い中央斜面と、橋の奥に隠れる細い川"></a></figure>
      <figure class="reference"><figcaption>参考原画</figcaption>
        <a href="../assets/source/concepts/wind_hills_scale_reference.png"><img src="../assets/source/concepts/wind_hills_scale_reference.png" alt="参考原画。草の棚と岩壁を横切る街道、右の渓流、山頂の遺跡"></a></figure>
      <figure><figcaption>修正後の固定構図</figcaption>
        <a href="images/m10_rebuild/relief/after_comparison.png"><img src="images/m10_rebuild/relief/after_comparison.png" alt="修正後。中央の段丘の重なり、蛇行する川と石橋、広がった山頂のアーチ"></a></figure>
    </div>
  </fieldset>
  <h2>修正後の地形を別の角度から見る</h2>
  <div class="details">
    <figure><figcaption>全体の俯瞰</figcaption>
      <a href="images/m10_rebuild/relief/after_overview.png"><img loading="lazy" src="images/m10_rebuild/relief/after_overview.png" alt="左支道の合流、右の橋、山頂広場を含む斜め上からの全景"></a></figure>
    <figure><figcaption>中央の段丘と街道</figcaption>
      <a href="images/m10_rebuild/relief/after_terraces.png"><img loading="lazy" src="images/m10_rebuild/relief/after_terraces.png" alt="異なる標高にある草地と岩面を縫って登る主街道"></a></figure>
    <figure><figcaption>右の谷・川・石橋</figcaption>
      <a href="images/m10_rebuild/relief/after_valley.png"><img loading="lazy" src="images/m10_rebuild/relief/after_valley.png" alt="上流、橋の下流、左右から橋に降りる支道"></a></figure>
    <figure><figcaption>山頂遺跡の前列と後列</figcaption>
      <a href="images/m10_rebuild/relief/after_summit.png"><img loading="lazy" src="images/m10_rebuild/relief/after_summit.png" alt="主アーチの左右と背後に並ぶアーチ、柱と壁の断片"></a></figure>
  </div>
  <p><a href="m10_rebuild_stage01_audit.md">寸法・検証・残っている構図上の課題</a></p>
</main></body>
</html>
